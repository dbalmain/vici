[workspace]
members = ["crates/vici"]
resolver = "3"

[workspace.package]
edition = "2024"
# Edition 2024 is the binding constraint; both dependencies sit far below it.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dbalmain/vici"
homepage = "https://github.com/dbalmain/vici"
authors = ["Dave Balmain <dsbalmain@agiledigital.com.au>"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
